name: Windows Portable PDF Gizlilik
on:
  push:
    paths:
      - 'pdf-gizlilik/**'
      - '.github/workflows/pdf-gizlilik-windows.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Paketleri kur
        run: |
          python -m pip install --upgrade pip
          pip install -r pdf-gizlilik/requirements.txt pyinstaller
      - name: Filtre ve PDF testleri
        run: python -m unittest discover -s pdf-gizlilik/tests -v
      - name: Tesseract OCR ve Turkce dil
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress
          $source = 'C:\Program Files\Tesseract-OCR'
          if (!(Test-Path "$source\tesseract.exe")) { throw 'Tesseract binary missing' }
          New-Item -ItemType Directory -Force -Path 'ocr-bundle' | Out-Null
          Copy-Item "$source\*" 'ocr-bundle/' -Recurse -Force
          $url = 'https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/tur.traineddata'
          Invoke-WebRequest -Uri $url -OutFile 'ocr-bundle/tessdata/tur.traineddata'
          if (!(Test-Path 'ocr-bundle/tessdata/eng.traineddata')) { throw 'English OCR data missing' }
      - name: EXE üret
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name PDF-Gizlilik `
            --paths pdf-gizlilik `
            --add-data "pdf-gizlilik/default_filters.json;." `
            --collect-all fitz --collect-all pymupdf `
            pdf-gizlilik/app.py
          Copy-Item 'ocr-bundle' 'dist/PDF-Gizlilik/tesseract' -Recurse -Force
          Copy-Item 'pdf-gizlilik/FINEREADER.md' 'dist/PDF-Gizlilik/FINEREADER_KULLANIM.txt'
          'PDF Gizlilik v4. Elle karartmak icin sayfada bir alan cizip Temiz PDF Olustur dugmesine basin. FineReader Konumu ile tam FineReaderOCR.exe dosyasini secin.' | Set-Content 'dist/PDF-Gizlilik/README.txt'
          Compress-Archive -Path 'dist/PDF-Gizlilik/*' -DestinationPath 'PDF-Gizlilik-Windows-Portable.zip'
      - name: Derleme dosyasini yayinla
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Gizlilik-Windows-Portable
          path: PDF-Gizlilik-Windows-Portable.zip
          retention-days: 30
